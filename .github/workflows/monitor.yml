name: Naver Booking Slot Monitor

on:
  workflow_dispatch:

  # 설정이나 코드가 바뀌면 실행 중인 감시를 취소하고 새 설정으로 다시 시작한다.
  # state/** 는 넣지 않는다. 상태 커밋이 다시 이 워크플로를 켜면 무한 루프가 된다.
  push:
    branches: [main]
    paths:
      - "monitors.json"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/monitor.yml"

  # 연결 실행 체인이 끊겼을 때 복구용.
  schedule:
    - cron: "7 */5 * * *"

permissions:
  contents: write # 상태 파일 커밋
  actions: write # 다음 실행 트리거

concurrency:
  group: naver-booking-slot-watch
  # push는 즉시 취소하고 새 설정으로 다시 시작한다.
  #
  # schedule은 취소하지 않고 큐에서 기다린다. cron 주기(5시간)가 LOOP_HOURS(5.4시간)
  # 보다 짧아서, 취소하면 복구용 cron이 매번 살아 있는 job을 죽이고 자기 연결 실행
  # 단계가 영원히 실행되지 않는다. 큐에 두면 체인이 죽었을 때만 실제로 인수한다.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 이동식 메이저 태그는 v7까지만 발행돼 있어 릴리스 태그로 고정한다.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_HEARTBEAT_TOPIC: ${{ secrets.NTFY_HEARTBEAT_TOPIC }}
          CHECK_INTERVAL_SEC: "70"
          CHECK_JITTER_SEC: "20"
          LOOP_HOURS: "5.4"
        run: |
          set +e
          uv run booking-slot-watch monitor
          code=$?
          set -e
          # exit 3 = 활성 대상 없음. 정상 종료로 다루고 다음 단계에서 연결을 생략한다.
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          exit "$code"

      - name: Commit state
        if: always()
        run: |
          if [ ! -f state/availability.json ]; then
            echo "상태 파일이 없다 - 커밋할 것이 없다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/availability.json
          if git diff --cached --quiet; then
            echo "상태 변화 없음 - 커밋하지 않는다"
            exit 0
          fi
          git commit -m "chore: update monitor state"
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::warning::상태 파일 rebase 충돌 - 푸시하지 않고 종료한다"
            exit 0
          fi
          # 푸시 경합에 져도 job을 실패시키지 않는다. 여기서 실패하면 다음 단계의
          # 연결 실행이 건너뛰어져 최대 5시간 동안 감시가 끊긴다. 상태 기록 하나와
          # 5시간의 공백을 맞바꿀 수는 없다. 중복 알림 가능성은 README에 적어뒀다.
          git push origin HEAD:main || echo "::warning::상태 푸시 실패 - 다음 실행이 원격 상태로 시작한다"

      - name: Trigger next run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run booking-slot-watch has-active-targets
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "활성 대상 없음 - 다음 실행을 만들지 않는다"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          gh workflow run monitor.yml --repo "${{ github.repository }}"
